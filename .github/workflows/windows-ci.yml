name: Windows CI and portable screenshot
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Temporary PoC: this normalizes checkout before Clippy but does not
      # enforce checked-in formatting. Enable --check once rustfmt is committed.
      - name: Format CI workspace (format debt tracked)
        run: cargo fmt --all
      - name: Static checks
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets
      - name: Build x64 Release
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Package prototype
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/rustshot.exe dist/RustShot.exe
          Copy-Item README.md dist/README.txt
          Compress-Archive -Path dist/* -DestinationPath RustShot-v0.5.0-win-x64-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RustShot-v0.5.0-win-x64-portable
          path: RustShot-v0.5.0-win-x64-portable.zip
          if-no-files-found: error
